<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云栖阁</title>
<style>
:root{
  --bg:#fff2f6;--bg2:#ffe0ea;--main:#ff8fab;--main-dark:#e56b8c;
  --accent:#ffc2d4;--text:#3a2530;--text-soft:#b08a98;--card:#ffffffee;
  --shadow:0 6px 22px rgba(229,107,140,.10);--radius:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .5s;
}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:12px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow)}
.topbar .left{display:flex;align-items:center;gap:8px;min-width:0}
.topbar .name{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.topbar .switch-btn{background:var(--accent);border:none;border-radius:12px;padding:4px 10px;font-size:13px;
  cursor:pointer;color:var(--main-dark);font-weight:600;}
.topbar .coin{font-size:13px;color:var(--text-soft)}

.trackBar{margin-top:8px;padding:8px 12px;background:var(--card);border-radius:var(--radius);
  box-shadow:var(--shadow);font-size:12px;color:var(--text-soft);cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;}
.trackBar .loc{color:var(--text);font-weight:500}
.trackBar .weather{font-size:11px;color:var(--text-soft)}

.relBar{margin-top:8px;padding:6px 12px;background:var(--card);border-radius:12px;
  box-shadow:var(--shadow);font-size:12px;color:var(--text-soft);
  display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
.relBar .rel-name{color:var(--text);font-weight:500}
.relBar .rel-value{color:var(--main-dark);font-weight:600}

.stats{display:flex;gap:6px;margin-top:10px;font-size:11px;flex-wrap:wrap}
.stat{flex:1;min-width:70px;background:var(--card);border-radius:12px;padding:6px 8px;box-shadow:var(--shadow)}
.stat .label{color:var(--text-soft);display:flex;justify-content:space-between}
.stat .bar{height:5px;background:var(--accent);border-radius:3px;margin-top:4px;overflow:hidden}
.stat .bar>i{display:block;height:100%;background:var(--main);border-radius:3px;transition:width .5s}

.stage{position:relative;margin-top:10px;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);aspect-ratio:1/1;background:var(--bg2);flex-shrink:0;}
.stage .bgImage{position:absolute;inset:0;background-size:cover;background-position:center;background-repeat:no-repeat}
.stage .bgDefault{position:absolute;inset:0;background:linear-gradient(160deg,var(--bg),var(--bg2));}
.stage .weatherFx{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:.55;}
.stage .weatherFx .drop{position:absolute;width:2px;height:14px;background:#9dc8e8;border-radius:2px;animation:fall 1s linear infinite;}
.stage .weatherFx .flake{position:absolute;color:#fff;font-size:12px;animation:fall 4s linear infinite;}
@keyframes fall{from{transform:translateY(-20px);opacity:0;}20%{opacity:1;}to{transform:translateY(300px);opacity:0;}}

#charWrap{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none;transition:left .5s ease, top .5s ease, opacity .6s ease;will-change:left, top, opacity;}
#charWrap.dragging{transition:none;cursor:grabbing}
#charWrap.away{opacity:0;pointer-events:none;}
#charWrap.sleeping{filter:none;}
#charFlip{width:100%;transition:transform .3s ease}
#charAnim{width:100%;transition:transform .3s ease;will-change:transform}
#charAnim.walking{animation:walkBob .5s ease-in-out 3}
#charAnim.breathing{animation:breathe2 4s ease-in-out infinite}
@keyframes breathe2{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
@keyframes walkBob{0%,100%{translate:0 0}50%{translate:0 -6px}}
#charAnim img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.14));will-change:transform;backface-visibility:hidden;}
#charAnim .placeholder{width:100%;aspect-ratio:1/1;border-radius:16px;border:2px dashed var(--accent);
  display:flex;align-items:center;justify-content:center;color:var(--text-soft);font-size:12px;
  text-align:center;padding:12px;background:var(--card);line-height:1.6;}
#charAnim.sleeping{transition:filter .5s;}
#charShadow{position:absolute;z-index:3;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(200,140,160,.28), rgba(0,0,0,0) 70%);
  border-radius:50%;transition:left .5s ease, top .5s ease, opacity .6s;}
#charShadow.away{opacity:0;}

#userWrap{position:absolute;z-index:4;cursor:grab;user-select:none;touch-action:none;
  transition:left .5s ease, top .5s ease;display:none;will-change:left, top;}
#userWrap.dragging{transition:none;cursor:grabbing}
#userWrap img{width:100%;display:block;pointer-events:none;filter:drop-shadow(0 5px 8px rgba(0,0,0,.12))}

#petWrap{position:absolute;z-index:8;cursor:pointer;user-select:none;touch-action:none;
  width:70px;height:70px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.15));
  transition:left 1s linear, top 1s linear;display:none;align-items:center;justify-content:center;
  font-size:38px;line-height:1;will-change:left, top;}
#petWrap.dragging{transition:none;cursor:grabbing}
#petWrap img{width:100%;height:100%;object-fit:contain;pointer-events:none;transform-origin:center;transition:transform .3s;}
#petWrap.flipH img{transform:scaleX(-1);}
#petWrap .zzz{position:absolute;top:-12px;right:-6px;font-size:14px;color:#aab;animation:breathe 3s infinite;}

#awayNoteBtn{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);
  padding:10px 18px;background:var(--card);border:none;border-radius:14px;box-shadow:var(--shadow);
  color:var(--main-dark);font-size:13px;cursor:pointer;display:none;font-weight:600;}
#awayNoteBtn.show{display:block;}

.bubbles{position:absolute;inset:0;pointer-events:none;z-index:6;overflow:hidden;}
.bubble{position:absolute;max-width:170px;padding:8px 12px;border-radius:14px;font-size:12px;
  line-height:1.45;box-shadow:var(--shadow);animation:pop .25s ease;pointer-events:auto;
  white-space:pre-wrap;}
.bubble.them{background:#fff;color:var(--text);border-bottom-left-radius:4px}
.bubble.you{background:var(--main);color:#fff;border-bottom-right-radius:4px}
.bubble.action{background:rgba(220,220,230,.92);color:#5a5a6a;border-bottom-right-radius:4px;font-style:italic;border:1px solid rgba(0,0,0,.05);}
.bubble.tip{background:#fff8e0;color:#a08040;border:1px solid #ffe0a0;font-size:11px}
.bubble.err{background:#ffe0e0;color:#a04040;border:1px solid #ffb0b0;font-size:11px;max-width:220px}
.bubble .kaomoji{display:block;margin-top:6px;font-size:11px;opacity:.75;text-align:center;letter-spacing:1px;}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

.inputbar{display:flex;gap:8px;margin-top:10px;align-items:center}
.inputbar input{flex:1;border:none;outline:none;padding:12px 16px;border-radius:999px;
  background:var(--card);color:var(--text);font-size:14px;box-shadow:var(--shadow)}
.inputbar input:disabled{opacity:.5}
.inputbar button{border:none;width:44px;height:44px;border-radius:50%;background:var(--main);
  color:#fff;font-size:18px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s}
.inputbar button:active{transform:scale(.9)}
.quick{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px}
.quick button{flex-shrink:0;border:none;padding:7px 14px;border-radius:999px;
  background:var(--card);color:var(--text);font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
.toolbar{display:flex;justify-content:space-around;margin-top:10px;padding:8px;
  background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);flex-wrap:wrap;gap:2px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;
  color:var(--text-soft);cursor:pointer;padding:6px 8px;border-radius:10px;transition:background .2s}
.tool:hover{background:var(--accent);color:#fff}
.tool .ico{font-size:18px}

#inAppNotif{
  position:fixed;top:10px;left:50%;transform:translate(-50%,-120%);
  z-index:9999;max-width:92%;width:380px;
  background:#fff;border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.18);
  padding:12px 14px;display:flex;gap:10px;align-items:center;
  transition:transform .35s cubic-bezier(.2,1.2,.4,1);
}
#inAppNotif.show{transform:translate(-50%,0);}
#inAppNotif .icon{width:38px;height:38px;border-radius:10px;background:var(--accent);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;}
#inAppNotif .icon img{width:100%;height:100%;object-fit:cover;}
#inAppNotif .body{flex:1;min-width:0;}
#inAppNotif .title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
#inAppNotif .msg{font-size:12px;color:var(--text-soft);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.modal-mask{position:fixed;inset:0;background:#00000033;display:none;
  align-items:flex-end;justify-content:center;z-index:100}
.modal-mask.show{display:flex}
.modal{width:100%;max-width:520px;max-height:85vh;overflow-y:auto;background:var(--bg);
  border-radius:24px 24px 0 0;padding:20px;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal h2{font-size:17px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.modal h2 .close{cursor:pointer;font-size:20px;color:var(--text-soft)}
.modal .field{margin-bottom:14px}
.modal label{display:block;font-size:13px;color:var(--text-soft);margin-bottom:6px}
.modal input,.modal select,.modal textarea{width:100%;border:none;outline:none;padding:11px 14px;
  border-radius:12px;background:var(--accent);color:var(--text);font-size:14px;font-family:inherit}
.modal textarea{min-height:70px;resize:vertical}
.modal .btn{width:100%;border:none;padding:13px;border-radius:12px;background:var(--main);
  color:#fff;font-size:15px;cursor:pointer;margin-top:6px}
.modal .btn.ghost{background:var(--accent);color:var(--text)}
.main-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.main-swatch{aspect-ratio:1;border-radius:12px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.08);}
.main-swatch.active{border-color:var(--text)}
.bg-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.bg-swatch{aspect-ratio:1;border-radius:12px;cursor:pointer;border:3px solid transparent;box-shadow:0 2px 6px rgba(0,0,0,.06);}
.bg-swatch.active{border-color:var(--text)}
.pos-palette{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.pos-swatch{aspect-ratio:2/1;border-radius:10px;cursor:pointer;border:3px solid transparent;
  background:var(--accent);display:flex;align-items:center;justify-content:center;
  font-size:12px;color:var(--text);font-weight:600;transition:transform .15s;}
.pos-swatch.active{border-color:var(--text);background:var(--main);color:#fff;}

.log-item{margin-bottom:12px;font-size:13px;line-height:1.5}
.log-item .who{font-size:11px;color:var(--text-soft);margin-bottom:2px}
.log-item.you .txt{color:var(--main-dark)}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:12px;
  background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(229,107,140,.06)}
.shop-item .info{font-size:14px;flex:1}
.shop-item .info small{color:var(--text-soft);font-size:11px;display:block}
.shop-item button{border:none;padding:8px 14px;border-radius:999px;background:var(--main);color:#fff;font-size:12px;cursor:pointer}
.timer-display{font-size:48px;text-align:center;font-weight:300;margin:30px 0;color:var(--main-dark)}
.sleep-mask{position:fixed;inset:0;background:#0a0a1a;z-index:200;display:none;
  flex-direction:column;align-items:center;justify-content:center;color:#aab}
.sleep-mask.show{display:flex}
.sleep-mask .zzz{font-size:20px;margin-top:20px;animation:breathe 4s infinite}
.sleep-mask .timer-small{font-size:12px;color:#556;margin-top:14px;}
@keyframes breathe{0%,100%{opacity:.4;transform:translateY(0)}50%{opacity:1;transform:translateY(-6px)}}
.sleep-mask .exit{position:absolute;bottom:40px;font-size:13px;color:#556;cursor:pointer}
.sleep-mask .story-btn{position:absolute;bottom:80px;font-size:13px;color:#889;cursor:pointer;
  padding:8px 16px;border:1px solid #334;border-radius:999px;}

.face-item{display:flex;gap:8px;align-items:center;background:var(--card);
  border-radius:12px;padding:8px;margin-bottom:8px;box-shadow:0 2px 8px rgba(229,107,140,.06)}
.face-item img{width:44px;height:44px;object-fit:cover;border-radius:8px;flex-shrink:0}
.face-item input{flex:1;margin:0}
.face-item button{border:none;padding:6px 10px;border-radius:999px;font-size:11px;cursor:pointer;background:#e08a8a;color:#fff;flex-shrink:0}
.face-item .tag-preview{font-size:11px;color:var(--main-dark);padding:2px 8px;background:var(--accent);border-radius:999px;flex-shrink:0;}
.lore-item{background:var(--card);border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 2px 8px rgba(229,107,140,.06)}
.lore-item input{margin-bottom:6px}
.lore-item .actions{display:flex;gap:6px;justify-content:flex-end}
.lore-item .actions button{border:none;padding:6px 12px;border-radius:999px;font-size:11px;cursor:pointer;background:var(--main);color:#fff}
.lore-item .actions button.del{background:#e08a8a}
.track-day{margin-bottom:14px}
.track-day h3{font-size:13px;color:var(--text-soft);margin-bottom:6px;font-weight:500}
.track-day .row{font-size:12px;padding:4px 0;color:var(--text)}
.track-day .row .time{color:var(--text-soft);margin-right:8px;font-size:11px}
.test-result{margin-top:8px;padding:10px;border-radius:12px;font-size:12px;line-height:1.5}
.test-result.ok{background:#e8f8ec;color:#2a7a3a;border:1px solid #b8e8c0}
.test-result.fail{background:#fdeaea;color:#a04040;border:1px solid #f0b8b8}
.game-item{padding:14px;background:var(--card);border-radius:14px;margin-bottom:10px;cursor:pointer;
  box-shadow:0 2px 8px rgba(229,107,140,.06);display:flex;justify-content:space-between;align-items:center;}
.game-item .g-name{font-size:14px;font-weight:500}
.game-item .g-desc{font-size:11px;color:var(--text-soft);margin-top:2px}
.game-item .g-arrow{color:var(--text-soft);}
.game-panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(229,107,140,.06);}
.game-panel .g-status{font-size:12px;color:var(--text-soft);margin-bottom:8px;text-align:center;}
.game-panel .g-content{font-size:13px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;}
.game-panel .g-input-row{display:flex;gap:8px;margin-top:8px;}
.game-panel .g-input-row input{flex:1;padding:10px 14px;border:none;outline:none;border-radius:12px;background:var(--accent);font-size:14px;color:var(--text);}
.game-panel .g-input-row button{padding:10px 16px;border:none;border-radius:12px;background:var(--main);color:#fff;font-size:14px;cursor:pointer;}
.game-panel .g-btn-row{display:flex;gap:8px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.game-panel .g-btn-row button{padding:8px 14px;border:none;border-radius:999px;background:var(--accent);color:var(--text);font-size:12px;cursor:pointer;}
.game-panel .g-log{max-height:180px;overflow-y:auto;font-size:12px;color:var(--text-soft);background:var(--bg);padding:8px;border-radius:10px;margin-top:8px;white-space:pre-wrap;}
.char-list-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--card);border-radius:14px;margin-bottom:8px;box-shadow:0 2px 8px rgba(229,107,140,.06);cursor:pointer;}
.char-list-item.active{outline:2px solid var(--main);}
.char-list-item img{width:44px;height:44px;object-fit:cover;border-radius:10px;flex-shrink:0;}
.char-list-item .avatar-placeholder{width:44px;height:44px;border-radius:10px;flex-shrink:0;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:22px;}
.char-list-item .info{flex:1;min-width:0;}
.char-list-item .info .n{font-size:14px;font-weight:500;}
.char-list-item .info .d{font-size:11px;color:var(--text-soft);}
.char-list-item .del-btn{border:none;padding:6px 10px;border-radius:999px;background:#e08a8a;color:#fff;font-size:11px;cursor:pointer;}
.pet-stat{margin-bottom:10px}
.pet-stat .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-bottom:4px;}
.pet-stat .bar{height:8px;background:var(--accent);border-radius:4px;overflow:hidden;}
.pet-stat .bar>i{display:block;height:100%;background:var(--main);border-radius:4px;transition:width .4s;}
.outfit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.outfit-cell{background:var(--card);border-radius:14px;padding:8px;box-shadow:0 2px 8px rgba(229,107,140,.06);
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;}
.outfit-cell.active{border-color:var(--main);}
.outfit-cell img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;}
.outfit-cell .lbl{font-size:11px;color:var(--text-soft);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 背单词样式 */
.word-book-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.word-book-cell{background:var(--card);border-radius:14px;padding:14px;cursor:pointer;
  border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px;}
.word-book-cell.active{border-color:var(--main);}
.word-book-cell .wb-ico{font-size:32px;}
.word-book-cell .wb-name{font-size:13px;font-weight:600;color:var(--text);}
.word-book-cell .wb-desc{font-size:11px;color:var(--text-soft);}
.word-card{background:var(--card);border-radius:18px;padding:24px 20px;text-align:center;
  box-shadow:var(--shadow);margin:12px 0;}
.word-card .word-en{font-size:28px;font-weight:600;color:var(--text);letter-spacing:1px;word-break:break-word;}
.word-card .word-pos{font-size:12px;color:var(--text-soft);margin-top:6px;}
.word-stat{display:flex;justify-content:space-around;margin:12px 0;font-size:12px;color:var(--text-soft);}
.word-stat b{color:var(--main-dark);font-size:16px;}
.word-result-ok{background:#e8f8ec;color:#2a7a3a;padding:12px;border-radius:12px;
  font-size:13px;line-height:1.6;margin-top:8px;}
.word-result-fail{background:#fdeaea;color:#a04040;padding:12px;border-radius:12px;
  font-size:13px;line-height:1.6;margin-top:8px;}

.notice-body{font-size:14px;line-height:1.8;color:var(--text);background:var(--card);border-radius:16px;padding:16px;white-space:pre-wrap;box-shadow:0 2px 8px rgba(229,107,140,.06);}
.notice-email{color:var(--main-dark);font-weight:600;}
</style>
</head>
<body>
<div id="inAppNotif">
  <div class="icon" id="inAppNotifIcon">💬</div>
  <div class="body">
    <div class="title" id="inAppNotifTitle">他</div>
    <div class="msg" id="inAppNotifMsg"></div>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="left">
      <div class="name" id="charName">他</div>
      <button class="switch-btn" onclick="openCharSwitch()">⇄ 切换</button>
    </div>
    <div class="coin">🪙 <span id="coinNum">0</span></div>
  </div>

  <div class="trackBar" id="trackBar" onclick="openTrack()">
    <span class="loc" id="trackNow">📍 正在加载…</span>
    <span class="weather" id="weatherNow"></span>
  </div>

  <div class="relBar" id="relBar" onclick="openRelationPanel()">
    <span>我们的关系：<span class="rel-name" id="relName">朋友</span></span>
    <span>好感 <span class="rel-value" id="relValue">10</span> / 100</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="label"><span>心情</span><span id="vMood">0</span></div><div class="bar"><i id="bMood"></i></div></div>
    <div class="stat"><div class="label"><span>饱食</span><span id="vFood">0</span></div><div class="bar"><i id="bFood"></i></div></div>
    <div class="stat"><div class="label"><span>精力</span><span id="vEnergy">0</span></div><div class="bar"><i id="bEnergy"></i></div></div>
  </div>

  <div class="stage" id="stage">
    <div class="bgDefault" id="bgDefault"></div>
    <div class="bgImage" id="bgImage" style="display:none"></div>

function getTodayFestival(){
  const d = new Date();
  const y = d.getFullYear();
  const md = `${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const full = `${y}-${md}`;
  if(md === '01-01') return { name:'元旦', emoji:'🎊', type:'solar' };
  if(md === '02-14') return { name:'情人节', emoji:'💘', type:'solar' };
  if(md === '05-01') return { name:'劳动节', emoji:'💪', type:'solar' };
  if(md === '06-01') return { name:'儿童节', emoji:'🎈', type:'solar' };
  if(md === '10-01') return { name:'国庆节', emoji:'🇨🇳', type:'solar' };
  if(md === '12-25') return { name:'圣诞节', emoji:'🎄', type:'solar' };
  const lunar = LUNAR_FESTIVALS[y];
  if(lunar){
    if(lunar.chunjie === full) return { name:'春节', emoji:'🧧', type:'lunar' };
    if(lunar.yuanxiao === full) return { name:'元宵节', emoji:'🏮', type:'lunar' };
    if(lunar.qixi === full) return { name:'七夕', emoji:'💕', type:'lunar' };
    if(lunar.zhongqiu === full) return { name:'中秋节', emoji:'🌕', type:'lunar' };
  }
  return null;
}

/* ============ Capacitor 插件安全获取 ============ */
function getCapPlugin(name){
  try{
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins[name]){
      return window.Capacitor.Plugins[name];
    }
  }catch(e){}
  return null;
}
async function requestNotifPermission(){
  const LN = getCapPlugin('LocalNotifications');
  if(!LN) return false;
  try{
    const r = await LN.requestPermissions();
    return r.display === 'granted';
  }catch(e){ return false; }
}
async function pushNativeNotif(title, body){
  const LN = getCapPlugin('LocalNotifications');
  if(!LN) return;
  try{
    await LN.schedule({
      notifications: [{
        id: Math.floor(Math.random()*100000),
        title: title || '他',
        body: body,
        schedule: { at: new Date(Date.now() + 500) },
      }]
    });
  }catch(e){}
}
async function saveFileToLocal(filename, content){
  const FS = getCapPlugin('Filesystem');
  if(!FS) return null;
  try{
    const res = await FS.writeFile({
      path: filename,
      data: content,
      directory: 'DOCUMENTS',
      encoding: 'utf8',
    });
    return res;
  }catch(e){ return null; }
}

let notifTimer = null;
function showInAppNotif(text){
  const box = document.getElementById('inAppNotif');
  if(!box) return;
  const title = document.getElementById('inAppNotifTitle');
  const msg = document.getElementById('inAppNotifMsg');
  const icon = document.getElementById('inAppNotifIcon');
  if(Current){
    const img = getBaseCharImage();
    if(img) icon.innerHTML = `<img src="${img}">`;
    else icon.textContent = '💬';
    title.textContent = Current.name;
  }
  msg.textContent = text;
  box.classList.add('show');
  if(notifTimer) clearTimeout(notifTimer);
  notifTimer = setTimeout(()=>{ box.classList.remove('show'); }, 4000);
}

/* ============ 图片压缩 ============ */
function compressImage(file, maxSize = 512, quality = 0.7){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if(w > maxSize || h > maxSize){
          if(w > h){ h = Math.round(h*maxSize/w); w = maxSize; }
          else { w = Math.round(w*maxSize/h); h = maxSize; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        const isPng = file.type === 'image/png' || file.type === 'image/webp' || file.type === 'image/gif'
          || /\.(png|webp|gif)$/i.test(file.name);
        resolve(canvas.toDataURL(isPng ? 'image/png' : 'image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ IndexedDB ============ */
const DB_NAME = 'yunqi_db';
const DB_STORE = 'save';
let dbInstance = null;
function openDB(){
  return new Promise((resolve, reject)=>{
    if(dbInstance) return resolve(dbInstance);
    if(!window.indexedDB) return reject(new Error('IndexedDB 不支持'));
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => { const db = e.target.result; if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE); };
    req.onsuccess = e => { dbInstance = e.target.result; resolve(dbInstance); };
    req.onerror = e => reject(e.target.error);
  });
}
async function idbSet(key, value){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e.target.error);
  });
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = e=>reject(e.target.error);
  });
}

/* ============ 主题色 ============ */
function hexToRgb(hex){ const n=parseInt(hex.replace('#',''),16); return { r:(n>>16)&255, g:(n>>8)&255, b:n&255 }; }
function rgbToHex(r,g,b){ r=Math.max(0,Math.min(255,Math.round(r))); g=Math.max(0,Math.min(255,Math.round(g))); b=Math.max(0,Math.min(255,Math.round(b))); return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0'); }
function shift(hex, amt){ const c=hexToRgb(hex); return rgbToHex(c.r+amt,c.g+amt,c.b+amt); }
function mixWithWhite(hex, ratio){ const c=hexToRgb(hex); return rgbToHex(c.r+(255-c.r)*ratio, c.g+(255-c.g)*ratio, c.b+(255-c.b)*ratio); }
function applyMainColor(hex){
  if(!hex) return;
  GlobalState.mainColor = hex;
  const r = document.documentElement.style;
  r.setProperty('--main', hex);
  r.setProperty('--main-dark', shift(hex, -40));
  r.setProperty('--accent', mixWithWhite(hex, 0.7));
  r.setProperty('--bg', mixWithWhite(hex, 0.92));
  r.setProperty('--bg2', mixWithWhite(hex, 0.78));
  r.setProperty('--text', '#3a2530');
  r.setProperty('--text-soft', '#b08a98');
  r.setProperty('--card', '#ffffffee');
  const c = hexToRgb(hex);
  r.setProperty('--shadow', `0 6px 22px rgba(${c.r},${c.g},${c.b},.18)`);
  document.body.style.background = `linear-gradient(160deg, ${mixWithWhite(hex,0.92)}, ${mixWithWhite(hex,0.78)})`;
}

async function callAIOnce(messages, opts={}){
  if(!API.ready) throw new Error('API 未配置');
  const body = { model: opts.model || API.model, messages, max_tokens: opts.maxTokens??600, temperature: opts.temperature??0.85 };
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), opts.timeout ?? 40000);
  try{
    const res = await fetch(API.baseUrl, { method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + API.key}, body: JSON.stringify(body), signal: ctrl.signal });
    clearTimeout(timer);
    if(!res.ok){ const errText = await res.text(); throw new Error(`HTTP ${res.status}: ${errText.slice(0,160)}`); }
    const data = await res.json();
    return data.choices?.[0]?.message?.content || null;
  }catch(e){ clearTimeout(timer); throw e; }
}
async function callAI(messages, opts={}){
  const tried = [];
  try{ tried.push(API.model); return await callAIOnce(messages, opts); }
  catch(e){
    if(!GlobalState.useFallback || !GlobalState.fallbackModels || !GlobalState.fallbackModels.length) throw e;
    for(const m of GlobalState.fallbackModels){
      if(!m || tried.includes(m)) continue;
      tried.push(m);
      try{ return await callAIOnce(messages, Object.assign({}, opts, {model:m})); }catch(e2){}
    }
    throw e;
  }
}

const WMO_CODE_MAP = {0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',48:'雾',51:'小雨',53:'小雨',55:'小雨',56:'冻雨',57:'冻雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'雪',80:'阵雨',81:'阵雨',82:'大雨',85:'阵雪',86:'大雪',95:'雷雨',96:'雷雨',99:'雷雨'};
function wmoToWeather(code){ return WMO_CODE_MAP[code] || '多云'; }
async function geocodeCity(cityName){
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=zh&format=json`);
  if(!res.ok) throw new Error('地理编码失败');
  const data = await res.json();
  if(!data.results || !data.results.length) throw new Error('找不到城市');
  const r = data.results[0]; return { lat: r.latitude, lon: r.longitude, name: r.name };
}
async function fetchWeatherByCoords(lat, lon){
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day&timezone=auto`);
  if(!res.ok) throw new Error('天气查询失败');
  const data = await res.json();
  if(!data.current) throw new Error('天气数据无效');
  return { weather: wmoToWeather(data.current.weather_code) };
}
function getUserLocation(){
  return new Promise((resolve, reject)=>{
    if(!navigator.geolocation) return reject(new Error('不支持定位'));
    navigator.geolocation.getCurrentPosition((pos)=>resolve({lat: pos.coords.latitude, lon: pos.coords.longitude}), (err)=>reject(err), {timeout: 8000, maximumAge: 600000});
  });
}
async function updateWeatherReal(force=false){
  const now = Date.now();
  if(!force && GlobalState.weatherUpdatedAt && (now - GlobalState.weatherUpdatedAt < 3600000)) return;
  try{
    let lat = GlobalState.weatherLat, lon = GlobalState.weatherLon, cityName = GlobalState.weatherCity;
    if(lat === null || lon === null){
      try{ const loc = await getUserLocation(); lat = loc.lat; lon = loc.lon; cityName=''; }catch(e){}
    }
    if((lat === null || lon === null) && GlobalState.weatherManualCity){
      try{ const geo = await geocodeCity(GlobalState.weatherManualCity); lat=geo.lat; lon=geo.lon; cityName=geo.name; }catch(e){}
    }
    if(lat === null || lon === null){
      GlobalState.weather = WEATHERS[Math.floor(Math.random()*WEATHERS.length)];
      GlobalState.weatherCity = GlobalState.weatherManualCity || '未知';
      GlobalState.weatherUpdatedAt = now;
      renderWeather(); saveGameDebounced(); return;
    }
    const w = await fetchWeatherByCoords(lat, lon);
    GlobalState.weatherLat = lat; GlobalState.weatherLon = lon;
    GlobalState.weatherCity = cityName || '当前城市';
    GlobalState.weather = w.weather;
    GlobalState.weatherUpdatedAt = now; GlobalState.weatherDate = todayStr();
    renderWeather(); saveGameDebounced();
  }catch(e){
    GlobalState.weather = WEATHERS[Math.floor(Math.random()*WEATHERS.length)];
    GlobalState.weatherDate = todayStr();
    renderWeather(); saveGameDebounced();
  }
}

function isPeriodNow(){
  if(!Current) return false;
  const p=Current.period;
  if(p.manualOn)return true;
  if(!p.lastStart)return false;
  const diffDays=Math.floor((new Date()-new Date(p.lastStart+'T00:00:00'))/86400000);
  if(diffDays<0)return false;
  return (diffDays%(p.cycle||28)) < (p.duration||5);
}
function periodInfo(){
  if(!Current) return {next:null,days:null};
  const p=Current.period;
  if(!p.lastStart)return {next:null,days:null};
  const next=new Date(new Date(p.lastStart+'T00:00:00').getTime()+(p.cycle||28)*86400000);
  return {next:next.toISOString().slice(0,10),days:Math.ceil((next-new Date())/86400000)};
}

/* ============ 行踪 ============ */
function todayStr(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function yesterdayStr(){
  const d = new Date(Date.now() - 86400000);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function nowHM(){
  const d=new Date();
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function logTrack(place, action){
  if(!Current) return;
  const date=todayStr(), time=nowHM();
  const last=Current.track[Current.track.length-1];
  if(last && last.date===date && last.place===place && last.action===action) return;
  Current.track.push({date,time,place,action});
  Current.track = Current.track.filter(t=>new Date(t.date+'T00:00:00').getTime() >= Date.now()-7*86400000);
  updateTrackBar(); saveGameDebounced();
}
function computeTrack(){
  if(!Current) return {place:'客厅', action:'发呆'};
  const h=new Date().getHours();
  if(Current.isAway) return {place:'外面', action:'打工'};
  if(Current.sick) return {place:'卧室', action:'休息'};
  if(h>=23 || h<6) return {place:'卧室', action:'睡觉'};
  if(h>=6 && h<9) return {place:'阳台', action:'发呆'};
  if(h>=9 && h<12) return {place:'客厅', action:'看书'};
  if(h>=12 && h<14) return {place:'厨房', action:'做饭'};
  if(h>=14 && h<18) return {place:'客厅', action:'发呆'};
  if(h>=18 && h<21) return {place:'客厅', action:'休息'};
  return {place:'卧室', action:'看书'};
}
function updateTrackBar(){
  if(!Current) return;
  // 自动检查角色是否该回来了
  if(Current.isAway && Current.awayUntil && Date.now() >= Current.awayUntil){
    Current.isAway = false;
    Current.awayUntil = null;
    saveGameDebounced();
  }
  const t=computeTrack();
  const el=document.getElementById('trackNow');
  if(el){
    if(Current.isAway && Current.awayUntil){
      const mins = Math.max(0, Math.ceil((Current.awayUntil - Date.now())/60000));
      el.textContent = `📍 他出门了 · 大概 ${mins} 分钟后回来`;
    } else {
      el.textContent=`📍 在${t.place} · ${t.action}`;
    }
  }
  checkSleepState();
  const wrap=document.getElementById('charWrap'), sh=document.getElementById('charShadow'), noteBtn=document.getElementById('awayNoteBtn');
  if(wrap && sh){
    if(Current.isAway){ wrap.classList.add('away'); sh.classList.add('away'); }
    else{ wrap.classList.remove('away'); sh.classList.remove('away'); }
  }
  if(noteBtn){ if(Current.isAway) noteBtn.classList.add('show'); else noteBtn.classList.remove('show'); }
}
let trackTimer=null;
function startTrackLoop(){
  if(trackTimer)clearInterval(trackTimer);
  updateTrackBar();
  const t=computeTrack();
  logTrack(t.place, t.action);
  trackTimer=setInterval(()=>{ const t=computeTrack(); logTrack(t.place, t.action); updateTrackBar(); }, 60000);
}

function matchLorebook(text){
  if(!Current||!Current.lorebook||!Current.lorebook.length)return [];
  const hits=[];
  for(const entry of Current.lorebook){
    if(!entry.key||!entry.text)continue;
    const keys=entry.key.split(/[,，]/).map(k=>k.trim()).filter(Boolean);
    if(keys.some(k=>text.includes(k)))hits.push(entry);
  }
  return hits;
}

/* ============ 解析 ============ */
const EMO_MAP={'开心':'happy','高兴':'happy','笑':'happy','害羞':'shy','脸红':'shy','难过':'sad','伤心':'sad','失落':'sad','生气':'angry','不满':'angry','哼':'angry','惊讶':'surprise','吃惊':'surprise','温柔':'tender','平静':'calm'};
function parseEmotion(text){
  const m=text.match(/\[([^\]]+)\]\s*$/);
  if(!m)return{clean:text,emo:'calm',label:null};
  const label=m[1].trim();
  const clean=text.replace(/\[[^\]]+\]\s*$/,'').trim();
  let emo='calm';
  for(const k in EMO_MAP){if(label.includes(k)){emo=EMO_MAP[k];break;}}
  return{clean,emo,label};
}
function parseBgColor(text){
  const m=text.match(/\[背景色[:：]\s*(#[0-9a-fA-F]{3,8})\s*\]/);
  if(!m)return{clean:text,color:null};
  return{clean:text.replace(m[0],'').trim(),color:m[1]};
}
function parseKaomoji(text){
  const m=text.match(/\[颜文字\]\s*([\s\S]+?)\s*$/);
  if(!m)return{clean:text,kaomoji:null};
  return{clean:text.replace(m[0],'').trim(),kaomoji:m[1].trim()};
}
function findEmotionImage(label,emo){
  if(!Current) return null;
  const imgs=Current.images||[]; if(!imgs.length)return null;
  if(label){ const hit=imgs.find(i=>i.label && (i.label.includes(label)||label.includes(i.label))); if(hit)return hit.img; }
  if(emo){
    const zh=({happy:'开心',shy:'害羞',sad:'难过',angry:'生气',surprise:'惊讶',tender:'温柔',calm:'平静'})[emo];
    if(zh){ const hit=imgs.find(i=>i.label && (i.label.includes(zh)||zh.includes(i.label))); if(hit)return hit.img; }
  }
  return null;
}
function applyEmotion(emo,label){
  const el=document.getElementById('charAnim'), img=document.getElementById('charImg');
  if(!el||!img)return;
  const customImg=findEmotionImage(label, emo);
  const baseImg=getBaseCharImage();
  if(customImg){
    img.src=customImg;
    if(window.__emoRestore)clearTimeout(window.__emoRestore);
    window.__emoRestore=setTimeout(()=>{ if(baseImg)img.src=baseImg; },1500);
  } else if(baseImg){ img.src=baseImg; }
  const map={happy:'scale(1.06) translateY(-4px)', shy:'scale(0.97) rotate(-3deg)', sad:'scale(0.96) translateY(3px)', angry:'scale(1.03) rotate(2deg)', surprise:'scale(1.08)', tender:'scale(1.02)', calm:'scale(1)'};
  el.style.transition='transform .3s';
  el.style.transform=map[emo]||map.calm;
  if(window.__emoTimer)clearTimeout(window.__emoTimer);
  window.__emoTimer=setTimeout(()=>{el.style.transform='scale(1)';},1500);
}

/* ============ 气泡 ============ */
const BUBBLE_LINE_HEIGHT = 54;
const BUBBLE_MAX = 8;
function getBubbleLeftFor(pos, stageW, bubbleW){
  const margin = 8;
  if(pos === 'left') return margin;
  if(pos === 'right') return Math.max(margin, stageW - bubbleW - margin);
  if(pos === 'random'){
    const r = Math.random();
    if(r < 0.33) return margin;
    if(r < 0.66) return Math.max(margin, (stageW - bubbleW)/2);
    return Math.max(margin, stageW - bubbleW - margin);
  }
  return Math.max(margin, (stageW - bubbleW)/2);
}
function repositionAllBubbles(){
  const box=document.getElementById('bubbles'), stage=document.getElementById('stage'), wrap=document.getElementById('charWrap'), userWrap=document.getElementById('userWrap');
  if(!box||!stage||!wrap) return;
  const stageRect = stage.getBoundingClientRect();
  const charRect = wrap.getBoundingClientRect();
  const charCenterX = charRect.left + charRect.width/2 - stageRect.left;
  const charTopY = charRect.top - stageRect.top;
  let userCenterX = stageRect.width/2, userTopY = stageRect.height/2;
  if(GlobalState.userShow && GlobalState.userImage && userWrap){
    const ur = userWrap.getBoundingClientRect();
    userCenterX = ur.left + ur.width/2 - stageRect.left;
    userTopY = ur.top - stageRect.top;
  }
  const charBubbles = Array.from(box.children).filter(c=>c.classList.contains('them') || c.classList.contains('action'));
  charBubbles.forEach((el, i)=>{
    const w = el.offsetWidth || 150, h = el.offsetHeight || 40;
    const left = Math.max(4, Math.min(stageRect.width - w - 4, charCenterX - w/2));
    const fromBottom = (charBubbles.length - 1 - i);
    const top = Math.max(4, charTopY - 8 - fromBottom * BUBBLE_LINE_HEIGHT - h);
    el.style.left = left + 'px'; el.style.top = top + 'px';
  });
  const youBubbles = Array.from(box.children).filter(c=>c.classList.contains('you'));
  const pos = GlobalState.userBubblePos || 'center';
  youBubbles.forEach((el, i)=>{
    const w = el.offsetWidth || 150, h = el.offsetHeight || 40;
    const left = getBubbleLeftFor(pos, stageRect.width, w);
    const fromBottom = (youBubbles.length - 1 - i);
    const top = Math.max(4, userTopY - 8 - fromBottom * BUBBLE_LINE_HEIGHT - h);
    el.style.left = left + 'px'; el.style.top = top + 'px';
  });
}
let bubbleTimer = null;
function repositionAllBubblesDebounced(){
  if(bubbleTimer) clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(()=>{ repositionAllBubbles(); }, 80);
}
function say(text,who='them',opts={}){
  const box=document.getElementById('bubbles'), stage=document.getElementById('stage');
  if(!box||!stage)return;
  const div=document.createElement('div');
  div.className='bubble '+who;
  const body=document.createElement('div'); body.textContent=text; div.appendChild(body);
  if(opts.kaomoji){ const k=document.createElement('div'); k.className='kaomoji'; k.textContent=opts.kaomoji; div.appendChild(k); }
  div.style.left = '-9999px'; div.style.top = '-9999px';
  box.appendChild(div);
  const sameType = Array.from(box.children).filter(c=>c.classList.contains(who));
  if(sameType.length > BUBBLE_MAX){
    const removeCount = sameType.length - BUBBLE_MAX;
    for(let i=0;i<removeCount;i++) box.removeChild(sameType[i]);
  }
  repositionAllBubblesDebounced();
  setTimeout(()=>{
    div.style.transition='opacity 1s'; div.style.opacity='0';
    setTimeout(()=>{ if(div.parentNode) div.remove(); repositionAllBubblesDebounced(); }, 1000);
  }, 8000);
}

/* ============ 触碰角色 ============ */
let charPressTimer = null, charPressed = false, charDownY = 0, lastDragEnd=0;
function bindCharTouch(wrap){
  let dragging=false, moved=false;
  let startX=0, startY=0, startCharX=0, startCharY=0;
  function onDown(e){
    if(e.target.closest('#charPlaceholder'))return;
    if(Current && (Current.isAway || Current.focusMode))return;
    e.preventDefault();
    charPressed = true;
    const rect = wrap.getBoundingClientRect();
    charDownY = (e.clientY - rect.top) / rect.height;
    if(charPressTimer) clearTimeout(charPressTimer);
    charPressTimer = setTimeout(()=>{
      if(charPressed && !moved){
        charPressed = false; dragging = false;
        wrap.classList.remove('dragging');
        document.removeEventListener('pointermove',onMove);
        document.removeEventListener('pointerup',onUp);
        document.removeEventListener('pointercancel',onUp);
        triggerTouchAction('hug');
      }
    }, 1000);
    dragging=true; moved=false;
    wrap.classList.add('dragging');
    startX=e.clientX; startY=e.clientY; startCharX=Current.x; startCharY=Current.y;
    document.addEventListener('pointermove',onMove,{passive:false});
    document.addEventListener('pointerup',onUp);
    document.addEventListener('pointercancel',onUp);
  }
  function onMove(e){
    if(!dragging)return;
    e.preventDefault();
    const stage=document.getElementById('stage'), rect=stage.getBoundingClientRect();
    const dx=(e.clientX-startX)/rect.width, dy=(e.clientY-startY)/rect.height;
    if(Math.abs(dx)>0.01||Math.abs(dy)>0.01)moved=true;
    if(moved && charPressTimer){ clearTimeout(charPressTimer); charPressTimer=null; charPressed=false; }
    Current.x=Math.max(0.1,Math.min(0.9,startCharX+dx));
    Current.y=Math.max(0.1,Math.min(0.85,startCharY+dy));
    positionCharacter();
  }
  function onUp(){
    if(charPressTimer){ clearTimeout(charPressTimer); charPressTimer=null; }
    if(!dragging)return;
    charPressed = false; dragging=false;
    wrap.classList.remove('dragging');
    document.removeEventListener('pointermove',onMove);
    document.removeEventListener('pointerup',onUp);
    document.removeEventListener('pointercancel',onUp);
    if(!moved){
      let action = 'hold';
      if(charDownY < 0.35) action = 'head';
      else if(charDownY < 0.65) action = 'face';
      else action = 'hand';
      triggerTouchAction(action);
    } else {
      triggerTouchAction('carry');
      if(Current.y < 0.65)dropToGround();
    }
    lastDragEnd=Date.now();
    Current.lastInteract=Date.now();
  }
  wrap.addEventListener('pointerdown',onDown);
}

function bindStage(){
  const stage=document.getElementById('stage');
  const wrap=document.getElementById('charWrap');
  const petEl=document.getElementById('petWrap');
  const userEl=document.getElementById('userWrap');
  bindCharTouch(wrap);
  if(userEl){
    let ud=false, ux=0, uy=0, usx=0, usy=0;
    userEl.addEventListener('pointerdown',e=>{
      e.preventDefault();e.stopPropagation();
      ud=true;userEl.classList.add('dragging');
      usx=e.clientX;usy=e.clientY;ux=GlobalState.userX;uy=GlobalState.userY;
      document.addEventListener('pointermove',uMove,{passive:false});
      document.addEventListener('pointerup',uUp);
    });
    function uMove(e){
      if(!ud)return;
      e.preventDefault();
      const rect=stage.getBoundingClientRect();
      const dx=(e.clientX-usx)/rect.width, dy=(e.clientY-usy)/rect.height;
      GlobalState.userX=Math.max(0.05,Math.min(0.95,ux+dx));
      GlobalState.userY=Math.max(0.5,Math.min(0.98,uy+dy));
      positionUser();
    }
    function uUp(){
      if(!ud)return;
      ud=false;userEl.classList.remove('dragging');
      document.removeEventListener('pointermove',uMove);
      document.removeEventListener('pointerup',uUp);
      saveGameDebounced();
    }
  }
  if(petEl){
    let petDragging=false, petMoved=false, psx=0, psy=0, pox=0, poy=0;
    petEl.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      petDragging=true; petMoved=false;
      petEl.classList.add('dragging');
      psx=e.clientX; psy=e.clientY; pox=Current.pet.x; poy=Current.pet.y;
      document.addEventListener('pointermove',petMove,{passive:false});
      document.addEventListener('pointerup',petUp);
      document.addEventListener('pointercancel',petUp);
    });
    function petMove(e){
      if(!petDragging)return;
      e.preventDefault();
      const rect=stage.getBoundingClientRect();
      const dx=(e.clientX-psx)/rect.width, dy=(e.clientY-psy)/rect.height;
      if(Math.abs(dx)>0.015||Math.abs(dy)>0.015)petMoved=true;
      Current.pet.x=Math.max(0.05,Math.min(0.95,pox+dx));

      if(!petDragging)return;
      petDragging=false;
      petEl.classList.remove('dragging');
      document.removeEventListener('pointermove',petMove);
      document.removeEventListener('pointerup',petUp);
      document.removeEventListener('pointercancel',petUp);
      if(!petMoved){ setTimeout(()=>{ openPetPanel(); }, 0); }
      saveGameDebounced();
    }
  }
  stage.addEventListener('click',e=>{
    if(e.target.closest('#charWrap'))return;
    if(e.target.closest('#petWrap'))return;
    if(e.target.closest('#userWrap'))return;
    if(e.target.closest('#awayNoteBtn'))return;
    if(Date.now()-lastDragEnd<300)return;
    if(Current && Current.focusMode)return;
    const rect=stage.getBoundingClientRect();
    walkTo((e.clientX-rect.left)/rect.width);
  });

}

/* ============ 状态衰减 / 打工 ============ */
const DECAY_PER_HOUR={food:6,energy:4,mood:3};
let lastTick=Date.now();
function tickStats(){
  if(!Current) return;
  const now=Date.now();
  const hours=(now-lastTick)/3600000;
  if(hours<0.01)return;
  lastTick=now;
  const s=Current.stats;
  s.food=Math.max(0,s.food-DECAY_PER_HOUR.food*hours);
  s.energy=Math.max(0,s.energy-DECAY_PER_HOUR.energy*hours);
  s.mood=Math.max(0,s.mood-DECAY_PER_HOUR.mood*hours);
  if(hours>6)s.mood=Math.max(0,s.mood-(hours-6)*2);
  if(s.food < 30){ s.mood = Math.max(0, s.mood - 3*hours); }
  const hour=new Date().getHours();
  if(hour >= 23 || hour < 6){ s.energy = Math.min(100, s.energy + 8*hours); }
  else if(s.food > 60){ s.energy = Math.min(100, s.energy + 1*hours); }
  const wd = getWeatherMoodDelta();
  if(wd) s.mood = Math.max(0, Math.min(100, s.mood + wd*0.3*hours));
  if(Current.lastInteract){
    const away = (now-Current.lastInteract)/3600000;
    if(away > 12 && !Current.fightUntil){ Current.fightUntil = now + 30*60000; s.mood = Math.max(0, s.mood - 5); say('他似乎有点失落，不太想说话。','them'); }
  }
  if(s.food<20&&s.energy<20&&!Current.sick){ Current.sick=true;say(`${Current.name}看起来不太舒服，脸色有点差……`,'them'); }
  if(Current.sick&&s.food>60&&s.energy>60){ Current.sick=false;say(`${Current.name}的精神好多了。`,'them'); }
  updateStats();saveGameDebounced();
}

    if(it.effect.energy)Current.stats.energy=Math.min(100,Current.stats.energy+it.effect.energy);

  Current.wordBook = key;

function pickRandomWord(){
  if(!Current) return null;
  const book = WORD_BOOKS[Current.wordBook];
  if(!book || !book.words || !book.words.length) return null;
  const w = book.words[Math.floor(Math.random()*book.words.length)];
  // 避免连续重复
  if(Current.wordCurrent && Current.wordCurrent.w === w.w && book.words.length > 1){
    return book.words[Math.floor(Math.random()*book.words.length)];
  }
  return w;

async function submitWordAnswer(){
  if(!Current || !Current.wordCurrent) return;
  if(Current.wordAnswered) return;
  const inp = document.getElementById('wordAnswerInput');
  if(!inp) return;
  const ans = inp.value.trim();
  if(!ans){ say('请输入答案','tip'); return; }
  Current.wordAnswered = true;
  const w = Current.wordCurrent;
  const box = document.getElementById('wordResult');
  // 简单判断：答对的判断交给 AI（因为中文意思有很多种表达）
  if(box){
    box.innerHTML = '<div style="text-align:center;color:var(--text-soft);font-size:13px;">他正在判断…</div>';
  }
  try {
    const sys = `你是一个英语单词助手。用户背的单词是「${w.w}」，正确意思是「${w.zh}」。用户填写的意思是「${ans}」。请判断用户答得对不对，如果基本意思对了就算对，只要意思接近就算对。只回复"对"或"不对"，不要别的文字。`;
    const reply = await callAI([
      {role:'system', content: sys},
      {role:'user', content: '判断'},
    ], {maxTokens: 10, temperature: 0.1});
    const isCorrect = reply && reply.includes('对') && !reply.includes('不对');
    Current.wordToday = (Current.wordToday||0) + 1;
    if(isCorrect){
      Current.wordTodayCorrect = (Current.wordTodayCorrect||0) + 1;
      addRelationValue(0.5);
    }
    saveGame();
    if(box){
      box.innerHTML = isCorrect
        ? `<div class="word-result-ok">✅ 答对啦！<br>「${w.w}」的意思是：<b>${w.zh}</b></div>`
        : `<div class="word-result-fail">❌ 再想想~<br>「${w.w}」的意思是：<b>${w.zh}</b></div>`;
    }
    // 角色反应
    await wordCharReply(isCorrect, w);
  } catch(e) {
    // AI 判断失败，退化成字符串匹配
    const isCorrect = w.zh.includes(ans) || ans.includes(w.zh.replace(/[a-z]+\.\s*/g,'').split(/[，,；;]/)[0]);
    Current.wordToday = (Current.wordToday||0) + 1;
    if(isCorrect){
      Current.wordTodayCorrect = (Current.wordTodayCorrect||0) + 1;
      addRelationValue(0.5);
    }
    saveGame();
    if(box){
      box.innerHTML = isCorrect
        ? `<div class="word-result-ok">✅ 答对啦！<br>「${w.w}」的意思是：<b>${w.zh}</b></div>`
        : `<div class="word-result-fail">❌ 再想想~<br>「${w.w}」的意思是：<b>${w.zh}</b></div>`;
    }
    await wordCharReply(isCorrect, w);
  }
}
async function wordCharReply(isCorrect, w){
  if(!API.ready || !Current) return;

      applyEmotion(emo,label);
      Current.chatLog.push({role:'assistant',text:clean,time:Date.now()});
      saveGameDebounced();
    }
  } catch(e){}

function savePomoGoal(){

function togglePomo(){
  if(pomo.running){
    clearInterval(pomo.timer);pomo.running=false;
    document.getElementById('pomoBtn').textContent='继续';
    return;
  }
  const min=parseInt(document.getElementById('pomoMin').value)||25;
  pomo.min = min;
  if(pomo.remain<=0||pomo.remain>min*60)pomo.remain=min*60;
  pomo.running=true;
  if(Current){ Current.focusMode = true; Current.focusUntil = Date.now() + pomo.remain*1000; }
  lockChat(true);
  document.getElementById('pomoBtn').textContent='暂停';
  if(API.ready && Current && !Current.isAway) proactiveTalk('idle').catch(()=>{});
  pomo.timer=setInterval(()=>{
    pomo.remain--;updatePomoDisplay();
    if(pomo.remain<=0){
      clearInterval(pomo.timer);pomo.running=false;
      document.getElementById('pomoBtn').textContent='开始专注';
      addRelationValue(3);
      if(Current){
        Current.stats.mood=Math.min(100,Current.stats.mood+5);
        Current.focusMode = false; Current.focusUntil = null;
        if(!Current.pomoHistory) Current.pomoHistory = [];
        Current.pomoHistory.push({ date: todayStr(), min: pomo.min, time: Date.now() });
        if(Current.pomoHistory.length > 50) Current.pomoHistory = Current.pomoHistory.slice(-50);
      }
      lockChat(false);
      updateStats();saveGame();
      if(API.ready && Current){
        const done = getTodayPomoMin();
        const goal = Current.pomoGoalMin || 0;
        let scene = '对方刚完成一次专注，用了 ' + pomo.min + ' 分钟。';
        if(goal > 0 && done >= goal) scene += ' 今天的目标已经完成了！';
        else if(goal > 0) scene += ' 今天还差 ' + (goal-done) + ' 分钟才达标。';
        const sys = buildSystemPrompt('') + '\n\n【场景】' + scene + '\n【要求】根据你的性格，说一句关心或夸奖的话，1~2句。不要提到"设定""规则"，不要用括号写动作。';
        callAI([
          {role:'system',content:sys},
          ...Current.chatLog.slice(-10).map(m=>({role:m.role,content:m.text})),
          {role:'user',content:'【系统触发】'},
        ]).then(reply=>{
          if(reply){
            let{clean,emo,label}=parseEmotion(reply);
            const bg=parseBgColor(clean); clean=bg.clean;
            const km=parseKaomoji(clean); clean=km.clean;
            if(bg.color)applyBgColor(bg.color);
            say(clean,'them',{kaomoji:km.kaomoji});
            applyEmotion(emo,label);
            Current.chatLog.push({role:'assistant',text:clean,time:Date.now()});
            showInAppNotif(clean);
            saveGameDebounced();
          }
        }).catch(()=>{});
        if(goal > 0 && done >= goal){
          setTimeout(()=>{
            const m2 = document.getElementById('modalContent');
            m2.innerHTML=`<h2>🎉 今日目标完成 <span class="close" onclick="closeModal()">×</span></h2>
              <p style="font-size:14px;color:var(--text);line-height:1.7;">今天你已经专注了 <b>${done}</b> 分钟，达成了 <b>${goal}</b> 分钟的目标！<br>${Current.name} 为你感到骄傲。</p>
              <button class="btn" onclick="closeModal()">好耶</button>`;
            openModal();
          }, 800);
        }
      }
    }
  },1000);
}
function updatePomoDisplay(){
  const el=document.getElementById('pomoDisplay');if(!el)return;
  const m=Math.floor(pomo.remain/60),s=pomo.remain%60;
  el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function lockChat(lock){
  const inp = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  if(inp){ inp.disabled = lock; inp.placeholder = lock ? '专注中，先专心…' : '和他说点什么…'; }

let sleepTimer=null, sleepStartAt=null, sleepTickTimer=null;
function openSleep(){
  const modal=document.getElementById('modalContent');
  modal.innerHTML=`
    <h2>陪睡 <span class="close" onclick="closeModal()">×</span></h2>
    <div class="field"><label>多久后自动结束（分钟，0 = 不自动）</label><input type="number" id="sleepMin" value="0" min="0" max="180"></div>
    <button class="btn" onclick="startSleep()">进入陪睡</button>
  `;
  openModal();
}
async function startSleep(){
  closeModal();
  const min=parseInt(document.getElementById('sleepMin').value)||0;
  const mask=document.getElementById('sleepMask');
  const text=document.getElementById('sleepText');
  mask.classList.add('show');text.textContent='……';
  if(API.ready){
    try {
      const reply=await callAI([
        {role:'system',content:buildSystemPrompt('')+'\n\n【场景】对方要睡了。\n【要求】轻声说一句晚安，1句，温柔一点。不要用括号写动作。'},
        {role:'user',content:'【系统触发】'},
      ]);
      if(reply)text.textContent=parseEmotion(reply).clean;
    } catch(e) {}
  }
  const anim=document.getElementById('charAnim'), wrap=document.getElementById('charWrap');
  if(anim)anim.classList.add('breathing');
  if(wrap)wrap.classList.add('sleeping');
  sleepStartAt = Date.now();
  if(sleepTickTimer) clearInterval(sleepTickTimer);
  sleepTickTimer = setInterval(()=>{
    const el = document.getElementById('sleepTimerShow');
    if(el && sleepStartAt){
      const sec = Math.floor((Date.now() - sleepStartAt)/1000);
      const m = Math.floor(sec/60), s = sec%60;
      el.textContent = `已经陪你 ${m} 分 ${String(s).padStart(2,'0')} 秒`;
    }
  }, 1000);
  if(min>0)sleepTimer=setTimeout(()=>endSleep(),min*60*1000);
  addRelationValue(2);
  if(Current) Current.stats.mood=Math.min(100,Current.stats.mood+5);
  updateStats();saveGame();
}
async function tellSleepStory(){
  if(!API.ready||!Current) return;
  const text=document.getElementById('sleepText');
  text.textContent = '……他想了想，开始轻声讲……';
  try {
    const reply=await callAI([
      {role:'system',content:buildSystemPrompt('')+'\n\n【场景】对方想听你讲一个晚安故事。\n【要求】用 3~5 句话讲一个温柔的、安静的、适合睡前听的小故事。不要加情绪标签，不要用括号写动作。'},
      {role:'user',content:'【系统触发】'},
    ]);
    if(reply) text.textContent = parseEmotion(reply).clean;
  } catch(e){ text.textContent = '（故事讲不出来，网络有点卡。）'; }
}
function endSleep(){
  if(sleepTimer){clearTimeout(sleepTimer);sleepTimer=null;}
  if(sleepTickTimer){clearInterval(sleepTickTimer);sleepTickTimer=null;}
  const anim=document.getElementById('charAnim'), wrap=document.getElementById('charWrap');
  if(anim)anim.classList.remove('breathing');
  if(wrap)wrap.classList.remove('sleeping');
  document.getElementById('sleepMask').classList.remove('show');
  addRelationValue(1);saveGame();
  if(Current) Current.stats.energy = Math.min(100, Current.stats.energy + 30);

    setTimeout(()=>{

      callAI([

        {role:'user',content:'【系统触发】'},
      ]).then(reply=>{
        if(reply){
          let{clean,emo,label}=parseEmotion(reply);
          const bg=parseBgColor(clean); clean=bg.clean;
          const km=parseKaomoji(clean); clean=km.clean;
          if(bg.color)applyBgColor(bg.color);
          say(clean,'them',{kaomoji:km.kaomoji});
          applyEmotion(emo,label);
          Current.chatLog.push({role:'assistant',text:clean,time:Date.now()});

  const modal=document.getElementById('modalContent');

async function bombGuess(){
  if(!Current||!Current.game||!Current.game.subState)return;
  const s = Current.game.subState;
  if(s.turn !== 'user')return;
  const input = document.getElementById('bombInput');
  const n = parseInt(input.value);
  if(!n || n<s.low || n>s.high){ document.getElementById('bombHint').textContent = `请输入 ${s.low}-${s.high} 之间的数字`; return; }
  input.value = '';
  s.log = s.log || []; s.log.push(`你猜：${n}`);
  if(n === s.target){
    s.log.push(`💥 踩到炸弹了！数字是 ${s.target}，你输了。`);
    document.getElementById('bombLog').textContent = s.log.join('\n');
    document.getElementById('bombHint').textContent = '你输了！点结束退出。';
    s.turn = 'over'; return;
  }
  if(n < s.target) s.low = n+1; else s.high = n-1;
  document.getElementById('bombRange').textContent = `范围：${s.low} - ${s.high}`;
  document.getElementById('bombLog').textContent = s.log.join('\n');
  s.turn = 'ai'; document.getElementById('bombHint').textContent = '他想一想…';
  setTimeout(()=>{
    const aiGuess = Math.floor(Math.random()*(s.high - s.low + 1)) + s.low;
    s.log.push(`他猜：${aiGuess}`);
    if(aiGuess === s.target){
      s.log.push(`💥 踩到炸弹了！数字是 ${s.target}，他输了。`);
      document.getElementById('bombLog').textContent = s.log.join('\n');
      document.getElementById('bombHint').textContent = '他输了！点结束退出。';
      s.turn = 'over'; addRelationValue(2); saveGame(); return;
    }
    if(aiGuess < s.target) s.low = aiGuess+1; else s.high = aiGuess-1;
    document.getElementById('bombRange').textContent = `范围：${s.low} - ${s.high}`;
    document.getElementById('bombLog').textContent = s.log.join('\n');
    document.getElementById('bombHint').textContent = '轮到你了'; s.turn = 'user';
  }, 800);
}

    <div class="game-panel">
      <div class="g-status" id="twentyStatus">他正在想一个东西…</div>
      <div class="g-content" id="twentyHint">你可以问 20 个是/不是问题，猜出他想的是什么。</div>
      <div class="g-log" id="twentyLog"></div>
      <div class="g-input-row"><input id="twentyInput" placeholder="问一个是/不是问题…"><button onclick="twentyAsk()">问</button></div>
      <div class="g-btn-row"><button onclick="twentyGuessMode()">我要猜答案</button><button onclick="closeGame()">结束</button></div>
    </div>
  `;
  openModal();
  try{
    const hint = getRecentGamesHint();
    const reply = await callAI([
      {role:'system',content:'你是一个 20 问游戏主持人。只输出 JSON。'},
      {role:'user',content:'请想一个常见的物品。要求：不要用"苹果"、"手机"、"书"这类烂大街的，换点有新意的日常物品。输出 JSON：{"item":"物品名"}。' + hint}
    ], {maxTokens:50, temperature:1.1});
    let item='苹果';
    try{ const j = JSON.parse(reply.match(/\{[\s\S]*\}/)[0]); item = j.item || '苹果'; }catch(e){}
    rememberGame(item);
    Current.game.subState.item = item;
    document.getElementById('twentyStatus').textContent = '他已经想好了。开始问吧（还剩 20 个问题）';
  }catch(e){ document.getElementById('twentyStatus').textContent = '生成失败：'+e.message; }
}
async function twentyAsk(){
  if(!Current||!Current.game||!Current.game.subState)return;
  const s = Current.game.subState;
  if(!s.item)return;
  if(s.questions >= s.max){ document.getElementById('twentyStatus').textContent = '20 个问题用完了，点「我要猜答案」'; return; }
  const input = document.getElementById('twentyInput');
  const q = input.value.trim(); if(!q)return;
  input.value = ''; s.questions++;
  s.log = s.log || []; s.log.push(`你问：${q}`);
  document.getElementById('twentyLog').textContent = s.log.join('\n');
  try{
    const reply = await callAI([
      {role:'system',content:`你想的东西是：${s.item}。玩家会问是/不是问题，你只能回答"是"、"不是"、"无关"。不要多说。`},
      {role:'user',content:q}
    ], {maxTokens:15, temperature:0.1});
    s.log.push('他答：'+(reply||'无关').trim());
    document.getElementById('twentyLog').textContent = s.log.join('\n');
  }catch(e){ s.log.push('他答：（网络出错）'); document.getElementById('twentyLog').textContent = s.log.join('\n'); }
  document.getElementById('twentyStatus').textContent = `还剩 ${s.max - s.questions} 个问题`;
}
async function twentyGuessMode(){
  if(!Current||!Current.game||!Current.game.subState)return;
  const s = Current.game.subState;
  if(!s.item)return;
  const guess = prompt('你觉得他想的什么？');
  if(!guess)return;
  s.log = s.log || []; s.log.push(`你猜：${guess}`);
  if(guess.trim() === s.item || s.item.includes(guess.trim()) || guess.trim().includes(s.item)){
    s.log.push(`🎉 猜对了！就是「${s.item}」。`); addRelationValue(3); saveGame();
  }else{ s.log.push(`❌ 不对。他想的是「${s.item}」。`); }
  document.getElementById('twentyLog').textContent = s.log.join('\n');
  s.item = null;
}
async function initStoryGame(){
  Current.game.subState = { turns: [], turn: 'user' };
  const modal=document.getElementById('modalContent');
  modal.innerHTML=`
    <h2>📖 接龙编故事 <span class="close" onclick="closeModal()">×</span></h2>
    <div class="game-panel">
      <div class="g-status">你一句，他一句，一起编一个故事</div>
      <div class="g-log" id="storyLog" style="min-height:150px;"></div>
      <div class="g-input-row"><input id="storyInput" placeholder="你写第一句…"><button onclick="storySend()">发</button></div>
      <div class="g-btn-row"><button onclick="storyEnd()">结束并查看全篇</button><button onclick="closeGame()">退出</button></div>
    </div>
  `;
  openModal();
}
async function storySend(){
  if(!Current||!Current.game||!Current.game.subState)return;
  const s = Current.game.subState;
  const input = document.getElementById('storyInput');
  const text = input.value.trim(); if(!text)return;
  input.value = '';
  s.turns.push('你：'+text);
  document.getElementById('storyLog').textContent = s.turns.join('\n');
  try{
    const history = s.turns.join('\n');
    const reply = await callAI([
      {role:'system',content:'你们在玩接龙编故事。根据前面的内容，接一句（1-2句），延续故事，别结束太快。只输出你要接的话。'},
      {role:'user',content:'当前故事：\n'+history+'\n\n请接一句。'}
    ], {maxTokens:120, temperature:0.9});
    if(reply){ s.turns.push('他：'+reply.trim()); document.getElementById('storyLog').textContent = s.turns.join('\n'); }
  }catch(e){ s.turns.push('他：（网络出错）'); document.getElementById('storyLog').textContent = s.turns.join('\n'); }
}
function storyEnd(){
  if(!Current||!Current.game||!Current.game.subState)return;

}

function openCharSwitch(){
  const modal=document.getElementById('modalContent');
  modal.innerHTML=`

    ${GlobalState.characters.map(c=>{
      const isActive = c.id === GlobalState.currentCharId;
      const img = (c.outfits&&c.outfits[c.currentOutfitIndex]) ? c.outfits[c.currentOutfitIndex].img : c.image;
      return `<div class="char-list-item ${isActive?'active':''}" onclick="switchCharacter('${c.id}')">

        ${GlobalState.characters.length>1 ? `<button class="del-btn" onclick="event.stopPropagation();deleteCharacter('${c.id}')">删除</button>` : ''}
      </div>`;
    }).join('')}

  `;
  openModal();

function switchCharacter(id){
  if(id === GlobalState.currentCharId) { closeModal(); return; }
  saveGame();
  GlobalState.currentCharId = id;
  Current = GlobalState.characters.find(c=>c.id===id);
  if(!Current){ Current = newCharacterData(id); GlobalState.characters.push(Current); }
  const box=document.getElementById('bubbles'); if(box) box.innerHTML='';
  pickRandomOutfit();
  renderCharacter(); renderPet(); updateStats(); updateRelationUI(); updateTrackBar();
  saveGame(); closeModal();
  say(`已切换到「${Current.name}」。`,'tip');
}
function createCharacter(){
  const id = 'c_' + Date.now();
  const c = newCharacterData(id); c.name = '新角色';
  GlobalState.characters.push(c); saveGame();
  switchCharacter(id);
}
function deleteCharacter(id){
  if(GlobalState.characters.length <= 1){ say('至少要保留一个角色。','tip'); return; }
  if(!confirm('确定要删除这个角色吗？')) return;
  GlobalState.characters = GlobalState.characters.filter(c=>c.id!==id);
  if(GlobalState.currentCharId === id){
    GlobalState.currentCharId = GlobalState.characters[0].id;
    Current = GlobalState.characters[0];
  }
  saveGame();
  const box=document.getElementById('bubbles'); if(box) box.innerHTML='';
  renderCharacter(); renderPet(); updateStats(); updateRelationUI(); updateTrackBar();
  openCharSwitch();
}

/* ============ 公告 ============ */
function noticeHash(text){ let h = 0; for(let i=0;i<text.length;i++){ h = ((h<<5)-h+text.charCodeAt(i))|0; } return 'h'+h; }
function isNoticeSeen(){
  try{ const saved = JSON.parse(localStorage.getItem('dream_notice_seen')||'null'); if(!saved) return false; return saved.hash === noticeHash(NOTICE_TEXT); }catch(e){ return false; }
}
function markNoticeSeen(){
  try{ localStorage.setItem('dream_notice_seen', JSON.stringify({ hash: noticeHash(NOTICE_TEXT), seenAt: Date.now() })); }catch(e){}
}
function openNotice(){
  const modal=document.getElementById('modalContent');
  let html = NOTICE_TEXT.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/(1473727478@qq\.com)/g, '<span class="notice-email">$1</span>');
  modal.innerHTML=`<h2>📢 公告 <span class="close" onclick="closeNotice()">×</span></h2><div class="notice-body">${html}</div><button class="btn" onclick="closeNotice()">知道了</button>`;

}
function closeNotice(){ markNoticeSeen(); closeModal(); }
