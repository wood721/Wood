name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Capacitor
        run: npm install -g @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Init Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npx cap init yunqi com.example.yunqi --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yunqi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
