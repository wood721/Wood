name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@6

      - name: Prepare project
        run: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6 @capacitor/assets@3

      - name: Init Capacitor
        run: |
          npx cap init 云栖阁 com.yunqi.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Generate icons and splash
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npx @capacitor/assets generate --android

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore yunqi.keystore \
            -alias yunqi \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass yunqi123456 \
            -keypass yunqi123456 \
            -dname "CN=Yunqi, OU=App, O=Yunqi, L=City, S=State, C=CN"

      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/../yunqi.keystore \
            -Pandroid.injected.signing.store.password=yunqi123456 \
            -Pandroid.injected.signing.key.alias=yunqi \
            -Pandroid.injected.signing.key.password=yunqi123456

      - name: Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/云栖阁.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yunqi-release-apk
          path: output/云栖阁.apk
